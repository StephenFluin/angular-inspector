<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Angular Inspector Options</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                padding: 24px;
                font:
                    14px/1.5 system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
            }
            main {
                max-width: 600px;
            }
            label {
                display: flex;
                gap: 8px;
                align-items: center;
                font-weight: 600;
            }
            #status {
                min-height: 1.5em;
                color: #2e7d32;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Angular Inspector Options</h1>
            <label>
                <input type="checkbox" id="optin" />
                Opt in to anonymous Angular usage reporting
            </label>
            <p>
                When enabled, the domain name of each site you visit that runs Angular or AngularJS, the version, and
                the date are sent once per domain to a public Firebase database.
            </p>
            <p>No information about you, your browser, or your browsing is collected or stored.</p>
            <p id="status" role="status"></p>
        </main>
        <script src="dist/options.js"></script>
    </body>
</html>
